name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

  publish:
    needs: [release]
    if: ${{ needs.release.outputs.release_created }}
    strategy:
      fail-fast: false
      matrix:
        # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#standard-github-hosted-runners-for-public-repositories
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 26
          cache: 'npm'
      - run: npm ci
      - run: npm run build:sea
      - name: Package release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/package release/artifacts
          artifact="backup-to-cloud-${{ needs.release.outputs.tag_name }}-${{ matrix.target }}"
          cp dist/sea/backup-to-cloud "release/package/${artifact}"
          tar -C release/package -czf "release/artifacts/${artifact}.tar.gz" "${artifact}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "release/artifacts/${artifact}.tar.gz" > "release/artifacts/${artifact}.tar.gz.sha256"
          else
            shasum -a 256 "release/artifacts/${artifact}.tar.gz" > "release/artifacts/${artifact}.tar.gz.sha256"
          fi
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.release.outputs.tag_name }}" release/artifacts/* --clobber
